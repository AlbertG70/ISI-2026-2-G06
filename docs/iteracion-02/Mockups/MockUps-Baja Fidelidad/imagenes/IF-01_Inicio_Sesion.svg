<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="100%" height="100%">
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; fill: #111111; }
    .frame { fill: #ffffff; stroke: #111111; stroke-width: 2; }
    .card { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .btn-hitbox { fill: #f0f0f0; stroke: #111111; stroke-width: 2; cursor: pointer; }
    .input-hitbox { fill: #fafafa; stroke: #444444; stroke-width: 1.5; }
    .alert-hitbox { fill: #ffffff; stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .meta { font-size: 11px; fill: #555555; }
    .label { font-size: 12px; font-weight: bold; }
    .btn-text { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .title { font-size: 16px; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Outer Mobile Screen Hitbox Frame -->
  <rect x="10" y="10" width="400" height="600" class="frame" />
  
  <!-- Frame Header Bar -->
  <rect x="10" y="10" width="400" height="28" fill="#f0f0f0" stroke="#111111" stroke-width="1" />
  <text x="20" y="28" class="meta">PANTALLA MOVIL | IF-01: INICIO DE SESION (/login)</text>

  <!-- Logo Hitbox -->
  <g transform="translate(140, 56)">
    <rect x="0" y="0" width="140" height="42" class="card" />
    <text x="70" y="26" class="btn-text">[ LOGO: DAGAZ ]</text>
  </g>
  <text x="210" y="116" font-size="12" class="meta" text-anchor="middle">Plataforma de Fact-Checking Ciudadano</text>

  <!-- Main Login Card Hitbox -->
  <g transform="translate(26, 136)">
    <rect x="0" y="0" width="368" height="440" class="card" />

    <!-- Title -->
    <text x="184" y="32" class="title">Iniciar Sesion (CU05)</text>
    <text x="184" y="52" class="meta" text-anchor="middle">Ingrese credenciales de usuario</text>
    <line x1="20" y1="64" x2="348" y2="64" stroke="#cccccc" stroke-dasharray="3,3" />

    <!-- Alert Box Hitbox -->
    <rect x="20" y="76" width="328" height="34" class="alert-hitbox" />
    <text x="32" y="98" font-size="11" fill="#333333">[ ALERTA: Credenciales invalidas ]</text>

    <!-- Field 1: Email -->
    <text x="20" y="132" class="label">Correo electronico:</text>
    <rect x="20" y="142" width="328" height="44" class="input-hitbox" />
    <text x="32" y="169" font-size="12" fill="#666666">| Input: ejemplo@correo.com</text>

    <!-- Field 2: Password -->
    <text x="20" y="210" class="label">Contrasena:</text>
    <rect x="264" y="196" width="84" height="26" class="btn-hitbox" />
    <text x="306" y="213" font-size="11" class="btn-text">[ Mostrar ]</text>
    
    <rect x="20" y="226" width="328" height="44" class="input-hitbox" />
    <text x="32" y="253" font-size="12" fill="#666666">| Input: ****************</text>

    <!-- Checkbox Hitbox -->
    <rect x="20" y="286" width="18" height="18" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
    <text x="24" y="300" font-size="12" font-weight="bold">X</text>
    <text x="46" y="300" font-size="11">[X] Mantener sesion en este equipo</text>

    <!-- Primary Button Hitbox (>= 48px) -->
    <g transform="translate(20, 326)">
      <rect x="0" y="0" width="328" height="48" class="btn-hitbox" fill="#e5e7eb" />
      <text x="164" y="29" class="btn-text">[ BOTON: INGRESAR A DAGAZ (h=48px) ]</text>
    </g>

    <!-- Register Link Hitbox -->
    <line x1="20" y1="392" x2="348" y2="392" stroke="#e5e5e5" />
    <text x="184" y="412" class="meta" text-anchor="middle">Aun no tiene una cuenta?</text>
    <text x="184" y="428" font-size="12" font-weight="bold" text-anchor="middle">[ ENLACE: Registrarse aqui ]</text>
  </g>
</svg>
