<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="100%" height="100%">
  <style>
    text { font-family: 'Consolas', 'Courier New', monospace; fill: #111111; }
    .frame { fill: #ffffff; stroke: #111111; stroke-width: 2; }
    .card { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    .btn-hitbox { fill: #f0f0f0; stroke: #111111; stroke-width: 2; cursor: pointer; }
    .input-hitbox { fill: #fafafa; stroke: #444444; stroke-width: 1.5; }
    .consent-hitbox { fill: #ffffff; stroke: #444444; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .meta { font-size: 11px; fill: #555555; }
    .label { font-size: 12px; font-weight: bold; }
    .btn-text { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .title { font-size: 16px; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Outer Mobile Screen Hitbox Frame -->
  <rect x="10" y="10" width="400" height="640" class="frame" />

  <!-- Top Frame Header Bar -->
  <rect x="10" y="10" width="400" height="28" fill="#f0f0f0" stroke="#111111" stroke-width="1" />
  <text x="20" y="28" class="meta">PANTALLA MOVIL | IF-02: REGISTRO CIUDADANO (/registro)</text>

  <!-- Logo Hitbox -->
  <g transform="translate(140, 52)">
    <rect x="0" y="0" width="140" height="38" class="card" />
    <text x="70" y="24" class="btn-text">[ LOGO: DAGAZ ]</text>
  </g>

  <!-- Register Card Hitbox -->
  <g transform="translate(26, 104)">
    <rect x="0" y="0" width="368" height="520" class="card" />

    <text x="184" y="30" class="title">Crear Cuenta (CU05)</text>
    <text x="184" y="48" class="meta" text-anchor="middle">Red comunitaria contra la desinformacion</text>
    <line x1="20" y1="58" x2="348" y2="58" stroke="#cccccc" stroke-dasharray="3,3" />

    <!-- Field 1: Email -->
    <text x="20" y="82" class="label">Correo electronico:</text>
    <rect x="20" y="90" width="328" height="38" class="input-hitbox" />
    <text x="32" y="114" font-size="12" fill="#666666">| Input: ciudadano@ejemplo.com</text>

    <!-- Field 2: Password -->
    <text x="20" y="146" class="label">Contrasena (minimo 8 caracteres):</text>
    <rect x="20" y="154" width="328" height="38" class="input-hitbox" />
    <text x="32" y="178" font-size="12" fill="#666666">| Input: ****************</text>

    <!-- Field 3: Confirm -->
    <text x="20" y="210" class="label">Confirmar contrasena:</text>
    <rect x="20" y="218" width="328" height="38" class="input-hitbox" />
    <text x="32" y="242" font-size="12" fill="#666666">| Input: ****************</text>

    <!-- Consent Box Hitbox (Ley 1581) -->
    <g transform="translate(20, 272)">
      <rect x="0" y="0" width="328" height="88" class="consent-hitbox" />
      <rect x="12" y="14" width="18" height="18" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
      <text x="16" y="28" font-size="12" font-weight="bold">X</text>
      <text x="38" y="24" font-size="11" font-weight="bold">[X] Consentimiento Ley 1581 de 2012</text>
      <text x="38" y="42" font-size="10" fill="#444444">Autorizo el tratamiento de mis datos</text>
      <text x="38" y="58" font-size="10" fill="#444444">para fines de verificacion y auditoria.</text>
      <text x="38" y="74" font-size="10" fill="#111111">[ Enlace: Terminos y Habeas Data ]</text>
    </g>

    <!-- Primary Button Hitbox -->
    <g transform="translate(20, 380)">
      <rect x="0" y="0" width="328" height="48" class="btn-hitbox" fill="#e5e7eb" />
      <text x="164" y="29" class="btn-text">[ BOTON: CREAR MI CUENTA (h=48px) ]</text>
    </g>

    <!-- Link to Login Hitbox -->
    <line x1="20" y1="448" x2="348" y2="448" stroke="#e5e5e5" />
    <text x="184" y="474" class="meta" text-anchor="middle">Ya tiene una cuenta registrada?</text>
    <text x="184" y="494" font-size="12" font-weight="bold" text-anchor="middle">[ ENLACE: Iniciar sesion aqui ]</text>
  </g>
</svg>
