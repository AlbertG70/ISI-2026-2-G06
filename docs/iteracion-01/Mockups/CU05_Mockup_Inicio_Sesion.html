<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap');
    * { font-family: 'Caveat', cursive !important; }
    body { background: #faf8f5; }
    .napkin-border { border: 2px solid #333; border-radius: 4px; }
    .sketch-line { border-bottom: 1.5px dashed #999; }
    .field { border: 1.5px solid #aaa; border-radius: 4px; padding: 10px 14px; font-size: 18px; width: 100%; box-sizing: border-box; background: #fefefe; outline: none; }
    .field:focus { border-color: #555; }
    .field::placeholder { color: #bbb; }
    .btn-login { background: #333; color: #fff; border: none; border-radius: 4px; padding: 12px; font-size: 20px; width: 100%; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .btn-login:hover { background: #555; }
    .btn-login:disabled { background: #999; cursor: not-allowed; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .check-anim { animation: popIn 0.3s ease; }
    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  </style>
</head>
<body class="p-6">
  <div style="max-width: 400px; margin: 0 auto;">

    <!-- Titulo -->
    <p style="font-size: 22px; color: #555; margin-bottom: 12px; text-align: center;">
      ✏️ Mockup Servilleta — CU05: Inicio de Sesión
    </p>

    <!-- Contenedor login -->
    <div class="napkin-border" style="background: #fff; padding: 28px;">

      <!-- Logo / icono -->
      <div style="text-align: center; margin-bottom: 16px;">
        <svg width="64" height="64" viewBox="0 0 100 100" style="display: inline-block; margin-bottom: 4px;">
          <!-- Dagaz rune ᛞ stylized -->
          <polygon points="20,10 50,50 20,90" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round"/>
          <polygon points="80,10 50,50 80,90" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round"/>
          <line x1="20" y1="10" x2="80" y2="10" stroke="#333" stroke-width="5" stroke-linecap="round"/>
          <line x1="20" y1="90" x2="80" y2="90" stroke="#333" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <p style="font-size: 28px; color: #222; margin: 6px 0 0 0; font-weight: 600; letter-spacing: 3px;">DAGAZ</p>
        <p style="font-size: 15px; color: #999; margin: 2px 0 0 0;">Inicia sesión para continuar</p>
      </div>

      <div class="sketch-line" style="margin: 14px 0;"></div>

      <!-- Formulario -->
      <div id="login-form">
        <!-- Usuario -->
        <div style="margin-bottom: 14px;">
          <label style="font-size: 17px; color: #555; display: block; margin-bottom: 4px;">👤 Usuario</label>
          <input id="input-user" type="text" class="field" placeholder="Ingresa tu usuario..." />
        </div>

        <!-- Contraseña -->
        <div style="margin-bottom: 14px;">
          <label style="font-size: 17px; color: #555; display: block; margin-bottom: 4px;">🔒 Contraseña</label>
          <input id="input-pass" type="password" class="field" placeholder="Ingresa tu contraseña..." />
        </div>

        <!-- Recordar + Olvidé -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
          <label style="font-size: 15px; color: #777; cursor: pointer;">
            <input type="checkbox" style="margin-right: 4px;" /> Recordar sesión
          </label>
          <span style="font-size: 15px; color: #2563eb; text-decoration: underline; cursor: pointer;">¿Olvidé mi contraseña?</span>
        </div>

        <!-- Boton -->
        <button id="btn-login" class="btn-login" onclick="doLogin()">
          Iniciar Sesión
        </button>

        <!-- Mensaje de error -->
        <p id="error-msg" style="display: none; text-align: center; font-size: 16px; color: #dc2626; margin: 10px 0 0 0;">
          ⚠ Usuario o contraseña incorrectos
        </p>
      </div>

      <!-- Estado: verificando -->
      <div id="verifying-state" style="display: none; text-align: center; padding: 20px 0;">
        <div class="spinner"></div>
        <span style="font-size: 18px; color: #555;">Verificando información...</span>
      </div>

      <!-- Estado: sesión iniciada -->
      <div id="success-state" style="display: none; text-align: center; padding: 20px 0;">
        <span class="check-anim" style="font-size: 52px; display: inline-block;">✅</span>
        <p style="font-size: 20px; color: #16a34a; margin: 8px 0 0 0; font-weight: 600;">¡Sesión iniciada!</p>
        <p style="font-size: 16px; color: #888; margin: 4px 0 0 0;">Bienvenido de vuelta, usuario.</p>
      </div>

    </div>

    <!-- Anotaciones -->
    <div style="margin-top: 14px; display: flex; justify-content: space-around; color: #aaa; font-size: 14px;">
      <span>← Credenciales →</span>
      <span>← Verificación →</span>
      <span>← Sesión iniciada →</span>
    </div>

  </div>

  <script>
    function doLogin() {
      const user = document.getElementById('input-user').value;
      const pass = document.getElementById('input-pass').value;
      const errorMsg = document.getElementById('error-msg');

      errorMsg.style.display = 'none';

      if (!user || !pass) {
        errorMsg.textContent = '⚠ Completa ambos campos';
        errorMsg.style.display = 'block';
        return;
      }

      // Ocultar form, mostrar verificando
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('verifying-state').style.display = 'block';

      // Simular verificación
      setTimeout(() => {
        document.getElementById('verifying-state').style.display = 'none';
        document.getElementById('success-state').style.display = 'block';
      }, 1800);
    }
  </script>
</body>
</html>
