<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAGAZ - Grafo de Credibilidad de Fuentes | Colombia</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dagaz-dark': '#1a1a2e',
                        'dagaz-light': '#faf8f5',
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-dagaz-light text-gray-900 font-sans antialiased flex flex-col min-h-screen">
    
    <!-- Header Fijo y Responsivo -->
    <header x-data="{ mobileMenuOpen: false }" class="bg-dagaz-dark text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center">
                    <a href="index.html" class="flex items-center gap-3" aria-label="Ir al inicio de DAGAZ">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 22L20 2L4 2L20 22"></path>
                            <path d="M4 2V22"></path>
                            <path d="M20 2V22"></path>
                        </svg>
                        <span class="text-3xl font-bold tracking-wider uppercase">Dagaz</span>
                    </a>
                </div>
                
                <nav class="hidden md:flex space-x-6 items-center">
                    <a href="index.html" class="text-xl font-medium px-4 py-2.5 rounded-lg text-white hover:bg-gray-800 transition-colors">Verificar</a>
                    <a href="fuentes.html" class="text-xl font-bold px-4 py-2.5 rounded-lg bg-white text-dagaz-dark shadow transition-colors">Fuentes</a>
                    <a href="acerca.html" class="text-xl font-medium px-4 py-2.5 rounded-lg text-white hover:bg-gray-800 transition-colors">Acerca de</a>
                </nav>

                <div class="md:hidden flex items-center">
                    <button @click="mobileMenuOpen = !mobileMenuOpen" type="button" class="inline-flex items-center justify-center p-3 rounded-lg text-white hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white min-h-[48px] min-w-[48px]" aria-label="Abrir menú principal">
                        <svg x-show="!mobileMenuOpen" class="h-8 w-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg x-show="mobileMenuOpen" style="display: none;" class="h-8 w-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div x-show="mobileMenuOpen" style="display: none;" class="md:hidden border-t border-gray-700 bg-dagaz-dark">
            <div class="px-4 pt-3 pb-6 space-y-2">
                <a href="index.html" class="block px-4 py-4 rounded-lg text-xl font-medium text-white hover:bg-gray-800 min-h-[48px]">Verificar</a>
                <a href="fuentes.html" class="block px-4 py-4 rounded-lg text-xl font-bold bg-white text-dagaz-dark min-h-[48px]">Fuentes</a>
                <a href="acerca.html" class="block px-4 py-4 rounded-lg text-xl font-medium text-white hover:bg-gray-800 min-h-[48px]">Acerca de</a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal: Grafo de Credibilidad (CU07) -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="max-w-6xl mx-auto" x-data="fuentesComponent()">
            
            <div class="mb-10 text-center">
                <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-4">Grafo de Credibilidad DAGAZ</h1>
                <p class="text-2xl text-gray-700 max-w-3xl mx-auto font-medium">
                    Jerarquía de fuentes de información y niveles de confiabilidad utilizados para la verificación de datos en Colombia.
                </p>
            </div>

            <!-- Controles y Filtros Reactivos -->
            <div class="bg-white p-6 rounded-2xl shadow-md mb-10 border border-gray-200">
                <div class="flex flex-col md:flex-row gap-6 items-center justify-between">
                    
                    <!-- Botones de Filtro por Nivel -->
                    <div class="flex flex-wrap gap-3 justify-center md:justify-start w-full md:w-auto">
                        <button @click="filtroNivel = 'todos'" 
                                :class="filtroNivel === 'todos' ? 'bg-gray-900 text-white shadow-md' : 'bg-gray-100 text-gray-800 hover:bg-gray-200'"
                                class="px-6 py-3 rounded-full text-xl font-bold transition-colors min-h-[48px]">
                            Todos
                        </button>
                        <template x-for="nivel in niveles" :key="nivel.nivel">
                            <button @click="filtroNivel = nivel.nivel" 
                                    :class="filtroNivel === nivel.nivel ? 'text-white shadow-md' : 'bg-gray-100 text-gray-800 hover:bg-gray-200'"
                                    :style="filtroNivel === nivel.nivel ? `background-color: ${nivel.color}` : ''"
                                    class="px-6 py-3 rounded-full text-xl font-bold transition-colors min-h-[48px]"
                                    x-text="'Nivel ' + nivel.nivel">
                            </button>
                        </template>
                    </div>

                    <!-- Buscador en Tiempo Real -->
                    <div class="w-full md:w-96">
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 text-xl">
                                🔍
                            </div>
                            <input type="text" x-model="busqueda" placeholder="Buscar por nombre o país..." 
                                   class="block w-full pl-12 pr-4 py-4 text-xl border-2 border-gray-300 rounded-xl text-gray-900 focus:ring-4 focus:ring-blue-400 bg-gray-50 min-h-[52px]">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Listado Jerárquico de Niveles y Fuentes -->
            <div class="space-y-12">
                <template x-for="nivel in nivelesFiltrados" :key="nivel.nivel">
                    <section x-show="fuentesFiltradas(nivel).length > 0">
                        <div class="mb-6 pl-5 border-l-8 rounded-sm" :style="`border-color: ${nivel.color}`">
                            <h2 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-2 flex items-center gap-3">
                                <span x-text="nivel.nombre"></span>
                                <span class="text-xl px-3.5 py-1 rounded-full text-white font-bold" :style="`background-color: ${nivel.color}`" x-text="'Nivel ' + nivel.nivel"></span>
                            </h2>
                            <p class="text-xl text-gray-600 font-medium" x-text="nivel.descripcion"></p>
                        </div>

                        <!-- Grilla de Tarjetas Responsiva -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <template x-for="fuente in fuentesFiltradas(nivel)" :key="fuente.nombre">
                                <div class="bg-white rounded-2xl p-6 border-2 border-gray-200 shadow-sm hover:shadow-lg transition-shadow flex flex-col justify-between">
                                    <div class="flex justify-between items-start mb-4">
                                        <div class="flex-1 pr-3">
                                            <div class="flex items-center gap-2 mb-1">
                                                <h3 class="text-2xl font-bold text-gray-900" x-text="fuente.nombre"></h3>
                                                <span x-show="fuente.verificada" title="Fuente Oficial Verificada" class="text-xl">⭐</span>
                                            </div>
                                            <p class="text-lg text-gray-500 font-medium" x-text="fuente.pais"></p>
                                        </div>
                                        
                                        <!-- Anillo de Confiabilidad SVG -->
                                        <div class="relative w-16 h-16 flex-shrink-0 flex items-center justify-center bg-gray-50 rounded-full">
                                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                                                <circle class="text-gray-200 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                                                <circle 
                                                    :class="{
                                                        'text-green-600': fuente.credibilidad >= 80,
                                                        'text-yellow-500': fuente.credibilidad >= 60 && fuente.credibilidad < 80,
                                                        'text-red-600': fuente.credibilidad < 60
                                                    }"
                                                    class="stroke-current transition-all duration-1000 ease-out" 
                                                    stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" 
                                                    :stroke-dasharray="251.2" 
                                                    :stroke-dashoffset="251.2 - (251.2 * fuente.credibilidad) / 100">
                                                </circle>
                                            </svg>
                                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                                <span class="text-xl font-bold text-gray-900" x-text="fuente.credibilidad + '%'"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="pt-4 border-t border-gray-100 mt-4">
                                        <a :href="fuente.url" target="_blank" rel="noopener noreferrer" 
                                           class="block w-full text-center bg-gray-50 hover:bg-gray-100 text-blue-700 font-bold text-lg py-3.5 px-4 rounded-xl border-2 border-gray-200 transition-colors">
                                            Visitar portal web ↗
                                        </a>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </section>
                </template>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-10 mt-auto border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left">
            <span class="text-2xl font-bold tracking-wider uppercase mb-2 block">Dagaz</span>
            <p class="text-lg text-gray-400">Grafo de fuentes verificado para el territorio colombiano. ISI-CORP 2026-II.</p>
        </div>
    </footer>

    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('fuentesComponent', () => ({
            filtroNivel: 'todos',
            busqueda: '',
            niveles: [
                {
                    nivel: 1,
                    nombre: 'Agencias Internacionales',
                    descripcion: 'Organismos multilaterales y agencias de noticias internacionales con máxima credibilidad editorial.',
                    color: '#16a34a',
                    fuentes: [
                        { nombre: 'Reuters', pais: 'Internacional', credibilidad: 98, url: 'https://reuters.com', verificada: true },
                        { nombre: 'Associated Press (AP)', pais: 'Internacional', credibilidad: 97, url: 'https://apnews.com', verificada: true },
                        { nombre: 'AFP', pais: 'Internacional', credibilidad: 96, url: 'https://afp.com', verificada: true },
                        { nombre: 'BBC', pais: 'Reino Unido', credibilidad: 95, url: 'https://bbc.com', verificada: true },
                        { nombre: 'OMS', pais: 'Internacional', credibilidad: 99, url: 'https://who.int', verificada: true },
                        { nombre: 'ONU', pais: 'Internacional', credibilidad: 98, url: 'https://un.org', verificada: true },
                    ]
                },
                {
                    nivel: 2,
                    nombre: 'Prensa Regional Colombiana',
                    descripcion: 'Medios de comunicación regionales de Colombia con cobertura local validada.',
                    color: '#2563eb',
                    fuentes: [
                        { nombre: 'El Colombiano', pais: 'Antioquia, Colombia', credibilidad: 82, url: 'https://elcolombiano.com', verificada: true },
                        { nombre: 'El Heraldo', pais: 'Atlántico, Colombia', credibilidad: 80, url: 'https://elheraldo.co', verificada: true },
                        { nombre: 'El País Cali', pais: 'Valle del Cauca, Colombia', credibilidad: 79, url: 'https://elpais.com.co', verificada: true },
                        { nombre: 'Vanguardia', pais: 'Santander, Colombia', credibilidad: 78, url: 'https://vanguardia.com', verificada: true },
                    ]
                },
                {
                    nivel: 3,
                    nombre: 'Prensa Nacional Colombiana',
                    descripcion: 'Principales medios de comunicación de alcance nacional en Colombia.',
                    color: '#ca8a04',
                    fuentes: [
                        { nombre: 'El Tiempo', pais: 'Colombia', credibilidad: 85, url: 'https://eltiempo.com', verificada: true },
                        { nombre: 'El Espectador', pais: 'Colombia', credibilidad: 84, url: 'https://elespectador.com', verificada: true },
                        { nombre: 'Semana', pais: 'Colombia', credibilidad: 76, url: 'https://semana.com', verificada: true },
                        { nombre: 'Portafolio', pais: 'Colombia', credibilidad: 81, url: 'https://portafolio.co', verificada: true },
                    ]
                },
                {
                    nivel: 4,
                    nombre: 'Verificadores Certificados IFCN',
                    descripcion: 'Organizaciones certificadas por la International Fact-Checking Network.',
                    color: '#7c3aed',
                    fuentes: [
                        { nombre: 'ColombiaCheck', pais: 'Colombia', credibilidad: 92, url: 'https://colombiacheck.com', verificada: true },
                        { nombre: 'La Silla Vacía', pais: 'Colombia', credibilidad: 89, url: 'https://lasillavacia.com', verificada: true },
                        { nombre: 'AFP Factual', pais: 'Internacional / Colombia', credibilidad: 94, url: 'https://factual.afp.com', verificada: true },
                        { nombre: 'Chequeado', pais: 'América Latina', credibilidad: 90, url: 'https://chequeado.com', verificada: true },
                    ]
                }
            ],
            
            get nivelesFiltrados() {
                if (this.filtroNivel === 'todos') return this.niveles;
                return this.niveles.filter(n => n.nivel === this.filtroNivel);
            },
            
            fuentesFiltradas(nivel) {
                if (!this.busqueda.trim()) return nivel.fuentes;
                const b = this.busqueda.toLowerCase();
                return nivel.fuentes.filter(f => 
                    f.nombre.toLowerCase().includes(b) || f.pais.toLowerCase().includes(b)
                );
            }
        }));
    });
    </script>
</body>
</html>
