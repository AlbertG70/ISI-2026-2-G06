# Configuración de Nixpacks para DAGAZ en Railway (Laravel 12 + Tailwind CSS v4)
[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "nodejs_20"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci || npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
